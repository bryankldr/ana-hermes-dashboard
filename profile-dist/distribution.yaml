name: anna
version: 0.2.0
description: ANNA BI operator profile for ana-hermes-dashboard (simoge-business + hud)
hermes_requires: ">=0.21.5"
author: bryankldr
license: MIT
env_requires:
  - name: DB_HOST
    description: MariaDB host (internal)
    required: false
    default: 127.0.0.1
  - name: DB_PORT
    description: MariaDB port
    required: false
    default: "3306"
  - name: DB_USER
    description: MariaDB user
    required: false
    default: root
  - name: DB_PASSWORD
    description: MariaDB password
    required: true
    default: ""
  - name: DB_NAME
    description: MariaDB database
    required: false
    default: kph_bwb_sandbox2
  - name: ANA_DB_SOURCE
    description: DB source switch local|remote
    required: false
    default: local
  - name: ANA_AUTH_REQUIRED
    description: Require local auth
    required: false
    default: "1"
