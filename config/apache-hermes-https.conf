# ANA Hermes Dashboard Apache Proxy Configuration (Apache Only)
# Setup untuk hud.kphbwb.web.id via Apache HTTP (port 80) → 127.0.0.1:8730
# Cloudflare Tunnel: https://hud.kphbwb.web.id → http://localhost:80

# Cara terapkan di server (butuh sudo):
#   sudo cp /opt/lampp/etc/httpd.conf /opt/lampp/etc/httpd.conf.bak-$(date +%Y%m%d)
#   sudo cp <path-ke-file-ini> /opt/lampp/etc/extra/httpd-hud.conf
#   sudo bash -c 'echo "Include etc/extra/httpd-hud.conf" >> /opt/lampp/etc/httpd.conf'
#   sudo /opt/lampp/bin/httpd -t
#   sudo /opt/lampp/bin/apachectl graceful

<VirtualHost *:80>
    ServerName hud.kphbwb.web.id

    # Identitas asli client diteruskan; JANGAN ubah Host (guard server cek Host/Origin).
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyRequests Off

    # Forward protocol agar Python server tahu ini dari HTTPS (Cloudflare)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-SSL "on"

    # File statis langsung dari disk (nol thread Python, tercepat untuk ratusan client).
    Alias /assets/ /opt/lampp/htdocs/ana-static/assets/
    Alias /vendor/ /opt/lampp/htdocs/ana-static/vendor/
    Alias /styles/ /opt/lampp/htdocs/ana-static/styles/
    Alias /src/ /opt/lampp/htdocs/ana-static/src/
    Alias /index.html /opt/lampp/htdocs/ana-static/index.html
    Alias /login.html /opt/lampp/htdocs/ana-static/login.html
    Alias /favicon.ico /opt/lampp/htdocs/ana-static/favicon.ico
    <Directory "/opt/lampp/htdocs/ana-static">
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    ExpiresActive On
    ExpiresDefault "access plus 1 day"
    ProxyPass /assets/ !
    ProxyPass /vendor/ !
    ProxyPass /styles/ !
    ProxyPass /src/ !
    ProxyPass /index.html !
    ProxyPass /login.html !
    ProxyPass /favicon.ico !

    # Streaming NDJSON + long-poll: jangan buffer, flush langsung, timeout ikut ANA_TIMEOUT=120.
    # Urutan penting: path spesifik dulu sebelum /api/ umum.
    ProxyPass /api/terminal-stream http://127.0.0.1:8730/api/terminal-stream timeout=300 flushpackets=on
    ProxyPass /api/run http://127.0.0.1:8730/api/run timeout=180 flushpackets=on
    ProxyPass /api/tiles/ http://127.0.0.1:8730/api/tiles timeout=120
    ProxyPass /api/ http://127.0.0.1:8730/api/ timeout=130
    # Halaman + file statis: JANGAN cache / dan index.html (token disuntik per start server).
    ProxyPass / http://127.0.0.1:8730/ timeout=60
    ProxyPassReverse / http://127.0.0.1:8730/

    # Cache HANYA aset statis berversi; matikan untuk API, root, pmtiles, stream, dan index.html (token injection).
    CacheQuickHandler off
    CacheEnable disk /assets/
    CacheEnable disk /vendor/
    CacheEnable disk /styles/
    CacheEnable disk /src/
    CacheDisable /api/
    CacheDisable /index.html
    CacheDisable /login.html
    CacheDisable /favicon.ico
    CacheDisable /
    CacheHeader on
    # Backend kirim Cache-Control: no-store untuk SEMUA respons (termasuk statis).
    # Untuk path aset berversi saja: buang no-store agar cache_disk bisa simpan.
    # API/root/index.html TIDAK disentuh (tetap no-store, token fresh).
    <LocationMatch "^/(assets|vendor|styles|src)/">
        Header unset Cache-Control
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>
    CacheIgnoreHeaders Set-Cookie
    CacheIgnoreCacheControl On
    CacheStoreNoStore On
    CacheDefaultExpire 86400
    CacheMaxExpire 604800

    # Kompres teks/JSON/JS/CSS; JANGAN kompres stream oktet dan pmtiles (rusak flush/range).
    SetEnvIfNoCase Request_URI "^/api/(terminal-stream|run|tiles/)" no-gzip
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript text/xml \
        application/javascript application/x-javascript application/json application/xml font/woff2 font/woff

    # pmtiles pakai Range: pastikan Apache teruskan Range ke backend (default ya),
    # dan jangan layani dari cache (sudah CacheDisable /api/).
    Header unset ETag

    ErrorLog "/opt/lampp/logs/hud-proxy-error_log"
    CustomLog "/opt/lampp/logs/hud-proxy-access_log" common
</VirtualHost>
