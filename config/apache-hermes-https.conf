# ANA Hermes Dashboard Apache Proxy Configuration (Apache Only)
# Setup untuk hud.kphbwb.web.id via Apache HTTP (port 80) → 127.0.0.1:8730
# Cloudflare Tunnel: https://hud.kphbwb.web.id → http://localhost:80

# Cara terapkan di server (butuh sudo):
#   sudo cp /opt/lampp/etc/httpd.conf /opt/lampp/etc/httpd.conf.bak-$(date +%Y%m%d)
#   sudo cp <path-ke-file-ini> /opt/lampp/etc/extra/httpd-hud.conf
#   sudo bash -c 'echo "Include etc/extra/httpd-hud.conf" >> /opt/lampp/etc/httpd.conf'
#   sudo /opt/lampp/bin/httpd -t
#   sudo /opt/lampp/bin/apachectl graceful

<VirtualHost *:80>
    ServerName hud.kphbwb.web.id

    # Identitas asli client diteruskan; JANGAN ubah Host (guard server cek Host/Origin).
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyRequests Off

    # Forward protocol agar Python server tahu ini dari HTTPS (Cloudflare)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-SSL "on"

    # Serve all static files from disk
    DocumentRoot "/opt/lampp/htdocs/ana-static"
    <Directory "/opt/lampp/htdocs/ana-static">
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.html
        AllowOverride None
    </Directory>

    # Proxy only API calls to Python server
    ProxyPass /api/ http://127.0.0.1:8730/api/ timeout=130
    ProxyPassReverse /api/ http://127.0.0.1:8730/api/

    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self' https://server.arcgisonline.com https://static.cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

    ErrorLog "/opt/lampp/logs/hud-proxy-error_log"
    CustomLog "/opt/lampp/logs/hud-proxy-access_log" common
</VirtualHost>
