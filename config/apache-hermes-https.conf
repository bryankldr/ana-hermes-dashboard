# ANA Hermes Dashboard HTTPS Proxy Configuration
# Setup untuk hermes.kphbwb.web.id via Apache HTTPS → 127.0.0.1:8730

# Cara terapkan di server (butuh sudo):
#   sudo cp /opt/lampp/etc/httpd.conf /opt/lampp/etc/httpd.conf.bak-$(date +%Y%m%d)
#   sudo cp <path-ke-file-ini> /opt/lampp/etc/extra/httpd-ana-hermes-https.conf
#   sudo bash -c 'echo "Include etc/extra/httpd-ana-hermes-https.conf" >> /opt/lampp/etc/httpd.conf'
#   sudo /opt/lampp/bin/httpd -t
#   sudo /opt/lampp/bin/apachectl graceful

# HTTPS Virtual Host (Port 443)
<VirtualHost *:443>
    ServerName hermes.kphbwb.web.id
    ServerAdmin admin@kphbwb.web.id

    # SSL Engine - Enable HTTPS
    SSLEngine on

    # SSL Certificate (XAMPP default location)
    SSLCertificateFile "/opt/lampp/etc/ssl.crt/server.crt"
    SSLCertificateKeyFile "/opt/lampp/etc/ssl.key/server.key"

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Proxy Configuration
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyRequests Off

    # Forward protocol agar Python server tahu ini HTTPS
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-SSL "on"

    # Proxy ke Python server di port 8730
    ProxyPass / http://127.0.0.1:8730/ timeout=120 flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8730/

    # Jangan cache API responses
    CacheDisable /api/
    CacheDisable /login

    # Logging
    ErrorLog "/opt/lampp/logs/ana-hermes-https-error_log"
    CustomLog "/opt/lampp/logs/ana-hermes-https-access_log" combined
</VirtualHost>

# HTTP Virtual Host (Port 80) - Redirect ke HTTPS
<VirtualHost *:80>
    ServerName hermes.kphbwb.web.id
    ServerAdmin admin@kphbwb.web.id

    # Redirect semua HTTP ke HTTPS
    Redirect permanent / https://hermes.kphbwb.web.id/

    ErrorLog "/opt/lampp/logs/ana-hermes-http-error_log"
    CustomLog "/opt/lampp/logs/ana-hermes-http-access_log" combined
</VirtualHost>
