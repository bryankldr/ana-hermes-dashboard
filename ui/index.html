<!doctype html>
<html lang="id" data-ana-mode="asisten">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="ana-token" content="__ANA_TOKEN__">
  <meta name="ana-directus-url" content="__ANA_DIRECTUS_URL__">
  <meta name="theme-color" content="#020F2A">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="ANA">
  <meta name="description" content="ANA HUD — KPHBWB Sandbox · Autonomous AI dashboard">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ANA · Autonomous AI HUD</title>
  <!-- Fonts self-hosted via tokens.css @font-face (offline-first, tanpa Google). -->
  <link rel="preload" href="assets/fonts/jakarta-var.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/hud.css?v=20261014d">
  <!-- xterm vendored locally (see ui/vendor/): the terminal is the one feature
       that cannot degrade, and a CDN outage would take the whole HUD down. -->
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- ?v= bumped manual tiap ubah CSS/JS: tanpa ini browser pakai cache lama
       dan perbaikan panel chart tak akan terlihat. -->
  <link rel="stylesheet" href="styles/map.css?v=20261014f">
  <!-- Boot gate (anti kilas panel disabled saat refresh): seluruh #hud
       tersembunyi sampai LayoutManager selesai terapkan layout/disabled,
       diganti tabir loading. Inline di HTML (no-store) agar selalu segar.
       visibility (bukan display) supaya measure() tetap akurat. -->
  <style>
    body:not(.layout-ready) #hud { visibility: hidden; }
    #bootVeil { position: fixed; inset: 0; z-index: 9999; display: flex;
      flex-direction: column; gap: 14px; align-items: center; justify-content: center;
      background: #020f2a; color: #9db4d8;
      font: 12px/1.5 system-ui, sans-serif; letter-spacing: .18em; }
    body.layout-ready #bootVeil { display: none; }
    #bootVeil .boot-spin { width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(45,242,255,.18); border-top-color: #2df2ff;
      animation: bootspin 1s linear infinite; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
  <noscript><style>#bootVeil { display: none; } body:not(.layout-ready) #hud { visibility: visible; }</style></noscript>
  <script defer src="vendor/xterm.js"></script>
  <script defer src="vendor/xterm-addon-fit.js"></script>
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="vendor/protomaps/protomaps-leaflet.min.js"></script>
  <script defer src="vendor/chart.js"></script>
  <script src="vendor/qrcode-generator.js"></script>
</head>
<body>
<div id="bootVeil" aria-hidden="true"><div class="boot-spin"></div><div>MEMUAT</div></div>
<div class="hud" id="hud">

  <!-- ═══ BACKGROUND LAYERS ═══ -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <canvas id="particles"></canvas>

  <!-- ═══ OUTER FRAME ═══ -->
  <div class="frame">
    <div class="frame-corner tl"></div>
    <div class="frame-corner tr"></div>
    <div class="frame-corner bl"></div>
    <div class="frame-corner br"></div>
    <div class="frame-bar top-left"></div>
    <div class="frame-bar top-right"></div>
    <div class="frame-bar bottom"></div>
  </div>

  <!-- ═══ TOP CONTROLS ═══ -->
  <button class="hud-drawer-btn" id="hudDrawerBtn" title="Menu — tampil / sembunyikan header" aria-label="Menu header">☰</button>
  <div class="top-controls" id="topControls"></div>

  <!-- ═══ TOP DIALS ═══ -->
  <div class="top-dials" id="topDials"></div>

  <!-- ═══ LEFT RAIL ═══ -->
  <div class="left-rail">
    <div class="panel" id="agentPanel">
      <div class="panel-title">AGENT STATUS</div>
      <div class="panel-body">
        <div class="stat-row"><span>MODEL</span><b id="stModel">—</b></div>
        <div class="stat-row"><span>PROFILE</span><b id="stMode">—</b></div>
        <div class="stat-row"><span>PERMISSION</span><b id="stCtx">—</b></div>
        <div class="stat-row"><span>RUNTIME</span><b id="stMem">—</b></div>
        <div class="stat-row"><span>SESSION</span><b id="stSess">—</b></div>
      </div>
    </div>
    <div class="panel" id="statusMatrix">
      <div class="panel-title">SYSTEM MATRIX</div>
      <div class="panel-body">
        <div class="matrix-grid" id="matrixGrid"></div>
      </div>
    </div>
    <div class="panel" id="workspacePanel">
      <div class="panel-title">WORKSPACE</div>
      <div class="panel-body">
        <svg id="workspaceSvg" viewBox="0 0 160 110" class="wireframe"></svg>
      </div>
    </div>
  </div>

  <!-- ═══ CENTRAL CORE — ANNA AVATAR ═══ -->
  <div class="core" id="core">
    <img id="coreImg" src="/assets/anna_forest.png" alt="ANNA" class="core-img"/>
    <div class="core-label" id="coreLabel">IDLE</div>
  </div>

  <!-- ═══ RIGHT RAIL ═══ -->
  <div class="right-rail">
    <div class="panel" id="intelPanel">
      <div class="panel-title">INTELLIGENCE SURFACE</div>
      <div class="panel-body">
        <div id="intelTerminal" class="intel-terminal"><div class="intel-line dim">Menunggu aktivitas agen...</div></div>
      </div>
    </div>
    <div class="panel" id="pipelinePanel">
      <div class="panel-title">AGENT PIPELINE</div>
      <div class="panel-body">
        <div class="pipeline" id="pipeline">
          <div class="pipe-node" data-stage="intent">INTENT</div>
          <div class="pipe-arrow">↓</div>
          <div class="pipe-node" data-stage="context">CONTEXT</div>
          <div class="pipe-arrow">↓</div>
          <div class="pipe-node" data-stage="memory">MEMORY</div>
          <div class="pipe-arrow">↓</div>
          <div class="pipe-node" data-stage="reasoning">REASONING</div>
          <div class="pipe-arrow">↓</div>
          <div class="pipe-node" data-stage="tools">TOOLS</div>
          <div class="pipe-arrow">↓</div>
          <div class="pipe-node" data-stage="result">RESULT</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ BOTTOM TELEMETRY ═══ -->
  <!-- Temperatures in Celsius, read from /sys/class/hwmon (k10temp Tctl) and
       nvidia-smi. The bars below are a scale from 20C to 100C, not a
       percentage: "94% full" is meaningless for a temperature. -->
  <div class="bottom-telemetry" id="bottomTelemetry">
    <div class="tele-left">
      <span class="tele-temp-icon" aria-hidden="true"></span>
      <div class="tele-thermo" role="meter" aria-label="CPU temperature">
        <div class="tele-thermo-fill" id="teleCpuTemp"></div>
      </div>
      <span class="tele-label">CPU</span>
      <b class="tele-temp-val" id="teleCpuTempVal">--</b>
      <span class="tele-unit">&deg;C</span>
    </div>
    <div class="tele-center" id="equalizerWrap">
      <canvas id="equalizer" width="80" height="24"></canvas>
    </div>
    <div class="tele-right">
      <span class="tele-temp-icon" aria-hidden="true"></span>
      <div class="tele-thermo" role="meter" aria-label="GPU temperature">
        <div class="tele-thermo-fill" id="teleGpuTemp"></div>
      </div>
      <span class="tele-label">GPU</span>
      <b class="tele-temp-val" id="teleGpuTempVal">--</b>
      <span class="tele-unit">&deg;C</span>
    </div>
  </div>

  <!-- ═══ CHATBOX (riwayat + input satu box) ═══ -->
  <button id="chatFab" title="Buka chat — ANNA" aria-label="Buka chat">💬</button>
  <div class="chatbox" id="chatBox" data-min-h="200" data-min-w="260">
    <div class="chatbox-head"><span class="chatbox-title">ANNA</span><span class="chatbox-status" id="chatboxStatus"></span><button id="chatMinBtn" class="chatbox-minbtn" title="Minimize chat" aria-label="Minimize chat">─</button></div>
    <div class="response-text chatbox-thread" id="responseText">Siap dengan analisa bisnis.</div>
    <div class="chat-main">
      <textarea id="chatInput" rows="1" placeholder="Mau analisa apa hari ini ?" autocomplete="off"></textarea>
      <div class="chat-tools">
        <div class="chat-tools-left">
          <button id="tplBtn" class="chat-ico only-asisten" title="Template pertanyaan bisnis" aria-label="Template pertanyaan">▦</button>
          <button id="sessionBtn" class="chat-ico" title="Daftar sesi" aria-label="Daftar sesi">📋</button>
          <span id="sessionId" class="chat-session-id" title="ID sesi aktif">—</span>
        </div>
        <div class="chat-tools-right">
          <button id="modeBtn" class="chat-mode" title="Ganti mode asisten/coding">ASISTEN</button>
          <button id="micBtn" class="chat-ico" title="Voice input" aria-label="Voice input">🎤</button>
          <button id="sendBtn" class="chat-send" title="Kirim (Enter)" aria-label="Kirim">➤</button>
        </div>
      </div>
    </div>
    <div id="tplPanel" class="tpl-panel only-asisten" hidden></div>
    <div id="sessionPanel" class="tpl-panel" hidden></div>
  </div>

  <!-- ═══ EVENT LOG ═══ -->
  <div class="event-log" id="eventLog">
    <div class="event-log-header">EVENT STREAM</div>
    <div class="event-entries" id="eventEntries"></div>
  </div>

  <!-- ═══ CODE VIEWER ═══ -->
  <div class="code-viewer" id="codeViewer">
    <div class="cv-header">AGENT EXECUTION</div>
    <pre class="cv-body" id="cvBody"></pre>
  </div>

</div>

<script type="module" src="src/main.js?v=20261014a"></script>
<script>
// PWA SW — universal (Chrome/Edge/Firefox/Safari/Samsung). Scope / via Service-Worker-Allowed header.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js?v=20261011a', { scope: '/' }).catch(()=>{});
  });
  // Firefox/Safari: expose manual install hint when beforeinstallprompt never fires
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; window.__anaDeferredPrompt = e; window.dispatchEvent(new CustomEvent('ana:pwa-installable')); });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; window.__anaDeferredPrompt = null; });
}
</script>
</body>
</html>
