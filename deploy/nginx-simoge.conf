# nginx di depan server.py — static via sendfile, Python hanya /api/*.
# Pasang di server target:
#   sudo sed -e "s|__ANA_WORKDIR__|/opt/simoge-dashboard|" -e "s|__ANA_PORT__|8730|" \
#     deploy/nginx-simoge.conf | sudo tee /etc/nginx/sites-available/simoge >/dev/null
#   && sudo ln -s /etc/nginx/sites-available/simoge /etc/nginx/sites-enabled/
#   && sudo nginx -t && sudo systemctl reload nginx
# Wajib: samakan __ANA_PORT__ dengan ANA_PORT di .env.
# Bila pakai domain: isi ANA_ALLOWED_HOSTS di .env (tanpa itu _host_ok 403).
# TLS: pasang certbot lalu tambah listen 443 ssl (lihat certbot --nginx).
upstream ana_py {
    server 127.0.0.1:__ANA_PORT__;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root __ANA_WORKDIR__/ui;
    access_log /var/log/nginx/simoge-access.log;
    error_log /var/log/nginx/simoge-error.log;

    # API + halaman login (no-store) terus ke Python.
    location ~ ^/(api/|login\.html|sw\.js|$) {
        proxy_pass http://ana_py;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # playlist backsound boleh berubah (lagu tambah/kurang) — JANGAN immutable.
    location = /assets/backsound/playlist.json {
        alias __ANA_WORKDIR__/ui/assets/backsound/playlist.json;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Backsound audio (content-addressed praktis: nama file = versi).
    location /assets/backsound/ {
        alias __ANA_WORKDIR__/ui/assets/backsound/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;
        tcp_nopush on;
        aio threads;
    }

    # Aset lain TANPA fingerprint (?v= hanya di CSS/JS) — 1 jam saja agar
    # update gambar/logo langsung tayang tanpa tunggu setahun.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }
    # CSS/JS berversi ?v=... + vendor/icons stabil: aman immutable.
    location ~* \.(js|css|png|webp|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sisa: Python (fallback).
    location / {
        proxy_pass http://ana_py;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
